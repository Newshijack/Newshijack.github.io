<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Math Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #030305;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 15px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(to right, #00f2fe, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 10px 30px rgba(79, 172, 254, 0.3);
            transition: all 0.3s ease;
        }

        /* Toggle Tabs */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255,255,255,0.7);
            padding: 10px 22px;
            border-radius: 30px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab-btn:hover { background: rgba(255, 255, 255, 0.1); color: white; }

        .tab-btn.active {
            background: rgba(0, 242, 254, 0.15); border-color: #00f2fe; color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); text-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
        }
        .tab-btn.active-cubes {
            background: rgba(255, 0, 255, 0.15); border-color: #ff00ff; color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.4); text-shadow: 0 0 10px rgba(255, 0, 255, 0.8);
        }
        .tab-btn.active-fractions {
            background: rgba(255, 138, 0, 0.15); border-color: #ff8a00; color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 138, 0, 0.4); text-shadow: 0 0 10px rgba(255, 138, 0, 0.8);
        }

        .grid-layout {
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            perspective: 1200px;
            max-width: 1600px;
            width: 100%;
            animation: fadeIn 0.4s ease-in-out;
        }

        .grid-layout.active-grid { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Standard Cards for Squares and Cubes */
        .glass-panel {
            background: rgba(20, 22, 28, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            border-left: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            width: 220px;
            padding: 20px 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.02);
            position: relative;
        }

        .header-row {
            display: flex; justify-content: space-between; padding: 0 10px 12px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1); margin-bottom: 12px;
            font-weight: 700; color: rgba(255,255,255,0.6); text-transform: uppercase;
            letter-spacing: 1px; font-size: 0.85rem;
        }

        .data-list { display: flex; flex-direction: column; gap: 5px; }

        .data-row {
            display: flex; justify-content: space-between; padding: 8px 12px;
            border-radius: 8px; background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent; transition: all 0.2s ease;
        }
        .data-row .num { font-weight: 500; color: #8892b0; }
        .data-row .val { font-weight: 700; color: #ffffff; letter-spacing: 0.5px; }

        @media (hover: hover) {
            .data-row:hover {
                background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
                transform: scale(1.05); box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            }
            .data-row:hover .num, .data-row:hover .val {
                color: var(--highlight-color); text-shadow: 0 0 10px var(--highlight-color);
            }
        }

        /* --- NEW MASTER TABLE FOR FRACTIONS --- */
        .master-table-container {
            width: 100%;
            max-width: 1200px;
            overflow-x: auto; /* Allows horizontal swiping on mobile */
            background: rgba(20, 22, 28, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            /* Custom scrollbar for desktop */
            scrollbar-width: thin;
            scrollbar-color: #ff8a00 rgba(255,255,255,0.05);
        }

        .master-table-container::-webkit-scrollbar { height: 10px; }
        .master-table-container::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 0 0 16px 16px; }
        .master-table-container::-webkit-scrollbar-thumb { background: #ff8a00; border-radius: 10px; }

        .master-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: center;
            font-size: 1.05rem;
        }

        .master-table th, .master-table td {
            padding: 14px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
        }

        /* Top Header Row (Numerators) */
        .master-table th {
            background: rgba(255, 138, 0, 0.15);
            color: #ff8a00;
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 2;
            text-shadow: 0 0 8px rgba(255, 138, 0, 0.5);
            border-bottom: 2px solid rgba(255, 138, 0, 0.3);
        }

        /* Frozen Left Column (Denominators) */
        .master-table td:first-child, .master-table th:first-child {
            position: sticky;
            left: 0;
            background: rgba(25, 28, 35, 0.95); /* Solid background to hide text sliding under it */
            color: #ff8a00;
            font-weight: 700;
            z-index: 3;
            border-right: 2px solid rgba(255, 138, 0, 0.3);
        }

        .master-table th:first-child { z-index: 4; }

        .master-table tbody tr:hover td {
            background: rgba(255, 255, 255, 0.05);
        }

        @media (hover: hover) {
            .master-table tbody td:not(:first-child):hover {
                background: rgba(255, 138, 0, 0.2) !important;
                color: #ffffff;
                text-shadow: 0 0 10px #ff8a00;
                transform: scale(1.1);
                border-radius: 6px;
                box-shadow: 0 0 15px rgba(255,138,0,0.4);
                cursor: crosshair;
            }
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .tab-btn { font-size: 0.85rem; padding: 10px 15px; }
            .glass-panel { width: 100%; max-width: 340px; }
            .master-table th, .master-table td { padding: 12px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="content-wrapper">
        <h1 id="main-title">Mathematical Core Data</h1>
        
        <div class="tabs">
            <button id="btn-squares" class="tab-btn active">Squares (1-125)</button>
            <button id="btn-cubes" class="tab-btn">Cubes (1-30)</button>
            <button id="btn-fractions" class="tab-btn">Percentages (1-25)</button>
        </div>

        <div class="grid-layout active-grid" id="grid-squares"></div>
        <div class="grid-layout" id="grid-cubes"></div>
        <div class="grid-layout" id="grid-fractions"></div>
    </div>

    <script>
        const gridSquares = document.getElementById('grid-squares');
        const gridCubes = document.getElementById('grid-cubes');
        const gridFractions = document.getElementById('grid-fractions');
        
        const squareThemes = [
            { highlight: '#00f2fe' }, { highlight: '#ff0844' }, { highlight: '#b224ef' },
            { highlight: '#ffc3a0' }, { highlight: '#43e97b' }
        ];

        const cubeThemes = [
            { highlight: '#ff00ff' }, { highlight: '#ffcc00' }, { highlight: '#39ff14' },
            { highlight: '#0099ff' }, { highlight: '#ff4500' }
        ];

        // 1. Generate Squares
        let htmlSquares = '';
        for (let col = 0; col < 5; col++) {
            htmlSquares += `<div class="glass-panel" style="--highlight-color: ${squareThemes[col].highlight}">
                        <div class="header-row"><span>No.</span><span>Square</span></div><div class="data-list">`;
            for (let row = 1; row <= 25; row++) {
                let num = col * 25 + row;
                htmlSquares += `<div class="data-row"><span class="num">${num}</span><span class="val">${(num * num).toLocaleString()}</span></div>`;
            }
            htmlSquares += `</div></div>`;
        }
        gridSquares.innerHTML = htmlSquares;

        // 2. Generate Cubes
        let htmlCubes = '';
        for (let col = 0; col < 5; col++) {
            htmlCubes += `<div class="glass-panel" style="--highlight-color: ${cubeThemes[col].highlight}">
                        <div class="header-row"><span>No.</span><span>Cube</span></div><div class="data-list">`;
            for (let row = 1; row <= 6; row++) {
                let num = col * 6 + row;
                htmlCubes += `<div class="data-row"><span class="num">${num}</span><span class="val">${(num ** 3).toLocaleString()}</span></div>`;
            }
            htmlCubes += `</div></div>`;
        }
        gridCubes.innerHTML = htmlCubes;

        // 3. Generate Master Table for Percentages (Fractions)
        let htmlFractions = `<div class="master-table-container">
                                <table class="master-table">
                                    <thead>
                                        <tr>
                                            <th>Denom \\ Num</th>`;
        
        // Header Row (Numerators 1 to 10)
        for (let col = 1; col <= 10; col++) {
            htmlFractions += `<th>${col}</th>`;
        }
        htmlFractions += `</tr></thead><tbody>`;
        
        // Data Rows (Denominators 1 to 25)
        for (let row = 1; row <= 25; row++) {
            htmlFractions += `<tr>
                                <td>/ ${row}</td>`;
            for (let col = 1; col <= 10; col++) {
                let percentage = (col / row) * 100;
                let formatted = Number.isInteger(percentage) ? percentage : percentage.toFixed(2);
                htmlFractions += `<td>${formatted}%</td>`;
            }
            htmlFractions += `</tr>`;
        }
        htmlFractions += `</tbody></table></div>`;
        gridFractions.innerHTML = htmlFractions;


        // TAB LOGIC
        const btnSquares = document.getElementById('btn-squares');
        const btnCubes = document.getElementById('btn-cubes');
        const btnFractions = document.getElementById('btn-fractions');
        const title = document.getElementById('main-title');
        let currentMode = 'squares';

        btnSquares.addEventListener('click', () => {
            btnSquares.className = 'tab-btn active';
            btnCubes.className = 'tab-btn';
            btnFractions.className = 'tab-btn';
            gridSquares.classList.add('active-grid');
            gridCubes.classList.remove('active-grid');
            gridFractions.classList.remove('active-grid');
            title.style.background = 'linear-gradient(to right, #00f2fe, #4facfe, #00f2fe)';
            title.style.webkitBackgroundClip = 'text';
            currentMode = 'squares';
        });

        btnCubes.addEventListener('click', () => {
            btnCubes.className = 'tab-btn active-cubes';
            btnSquares.className = 'tab-btn';
            btnFractions.className = 'tab-btn';
            gridCubes.classList.add('active-grid');
            gridSquares.classList.remove('active-grid');
            gridFractions.classList.remove('active-grid');
            title.style.background = 'linear-gradient(to right, #ff00ff, #00ffff, #ccff00)';
            title.style.webkitBackgroundClip = 'text';
            currentMode = 'cubes';
        });

        btnFractions.addEventListener('click', () => {
            btnFractions.className = 'tab-btn active-fractions';
            btnSquares.className = 'tab-btn';
            btnCubes.className = 'tab-btn';
            gridFractions.classList.add('active-grid');
            gridSquares.classList.remove('active-grid');
            gridCubes.classList.remove('active-grid');
            title.style.background = 'linear-gradient(to right, #ff8a00, #e52e71)';
            title.style.webkitBackgroundClip = 'text';
            currentMode = 'fractions';
        });


        // BACKGROUND PARTICLES
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        let pointer = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', (e) => { pointer.x = e.clientX; pointer.y = e.clientY; });
        window.addEventListener('mouseout', () => { pointer.x = null; pointer.y = null; });
        window.addEventListener('touchstart', (e) => { pointer.x = e.touches[0].clientX; pointer.y = e.touches[0].clientY; });
        window.addEventListener('touchmove', (e) => { pointer.x = e.touches[0].clientX; pointer.y = e.touches[0].clientY; });
        window.addEventListener('touchend', () => { pointer.x = null; pointer.y = null; });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }
        window.addEventListener('resize', resize);
        
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > width || this.x < 0) this.speedX *= -1;
                if (this.y > height || this.y < 0) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            let numberOfParticles = (width * height) / 9000;
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                
                for (let j = i; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 100) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.15 - distance/1000})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
                
                if (pointer.x != null) {
                    const dxMouse = particles[i].x - pointer.x;
                    const dyMouse = particles[i].y - pointer.y;
                    const distanceMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);
                    
                    if (distanceMouse < pointer.radius) {
                        ctx.beginPath();
                        if (currentMode === 'squares') {
                            ctx.strokeStyle = `rgba(0, 242, 254, ${1 - distanceMouse/pointer.radius})`;
                        } else if (currentMode === 'cubes') {
                            ctx.strokeStyle = `rgba(255, 0, 255, ${1 - distanceMouse/pointer.radius})`;
                        } else {
                            ctx.strokeStyle = `rgba(255, 138, 0, ${1 - distanceMouse/pointer.radius})`;
                        }
                        ctx.lineWidth = 1;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(pointer.x, pointer.y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }

        resize();
        animateParticles();
    </script>
</body>
</html>
