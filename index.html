<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Math Dashboard</title>
    
    <!-- Google Fonts -->
    <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');</style>
    
    <!-- Three.js Library & OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            background-color: #030305; font-family: 'Outfit', sans-serif;
            color: #ffffff; overflow-x: hidden;
        }

        #canvas-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        .content-wrapper { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; padding: 40px 15px; }

        h1 {
            font-size: 2.8rem; font-weight: 700; background: linear-gradient(to right, #00f2fe, #4facfe, #00f2fe);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px;
            letter-spacing: 2px; text-align: center; text-shadow: 0 10px 30px rgba(79, 172, 254, 0.3); transition: all 0.3s ease;
        }

        .tabs { display: flex; gap: 12px; margin-bottom: 40px; flex-wrap: wrap; justify-content: center; max-width: 900px; }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: rgba(255,255,255,0.7);
            padding: 10px 22px; border-radius: 30px; font-family: 'Outfit', sans-serif; font-size: 1rem;
            font-weight: 500; cursor: pointer; backdrop-filter: blur(10px); transition: all 0.3s ease;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .tab-btn:hover { background: rgba(255, 255, 255, 0.1); color: white; }

        .tab-btn.active-squares { background: rgba(0, 242, 254, 0.15); border-color: #00f2fe; color: #ffffff; box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); text-shadow: 0 0 10px rgba(0, 242, 254, 0.8); }
        .tab-btn.active-cubes { background: rgba(255, 0, 255, 0.15); border-color: #ff00ff; color: #ffffff; box-shadow: 0 0 20px rgba(255, 0, 255, 0.4); text-shadow: 0 0 10px rgba(255, 0, 255, 0.8); }
        .tab-btn.active-fractions { background: rgba(255, 138, 0, 0.15); border-color: #ff8a00; color: #ffffff; box-shadow: 0 0 20px rgba(255, 138, 0, 0.4); text-shadow: 0 0 10px rgba(255, 138, 0, 0.8); }
        .tab-btn.active-2d { background: rgba(57, 255, 20, 0.15); border-color: #39ff14; color: #ffffff; box-shadow: 0 0 20px rgba(57, 255, 20, 0.4); text-shadow: 0 0 10px rgba(57, 255, 20, 0.8); }
        .tab-btn.active-3d { background: rgba(112, 0, 255, 0.15); border-color: #7000ff; color: #ffffff; box-shadow: 0 0 20px rgba(112, 0, 255, 0.4); text-shadow: 0 0 10px rgba(112, 0, 255, 0.8); }

        .grid-layout { display: none; flex-wrap: wrap; justify-content: center; gap: 25px; perspective: 1200px; max-width: 1600px; width: 100%; animation: fadeIn 0.4s ease-in-out; }
        .grid-layout.active-grid { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* General Data Panels */
        .glass-panel {
            background: rgba(20, 22, 28, 0.5); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-top: 1px solid rgba(255, 255, 255, 0.25); border-left: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px; width: 220px; padding: 20px 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.02);
        }
        .header-row { display: flex; justify-content: space-between; padding: 0 10px 12px; border-bottom: 2px solid rgba(255, 255, 255, 0.1); margin-bottom: 12px; font-weight: 700; color: rgba(255,255,255,0.6); text-transform: uppercase; font-size: 0.85rem; }
        .data-list { display: flex; flex-direction: column; gap: 5px; }
        .data-row { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: 8px; background: rgba(255, 255, 255, 0.02); border: 1px solid transparent; transition: all 0.2s ease; }
        .data-row .num { font-weight: 500; color: #8892b0; }
        .data-row .val { font-weight: 700; color: #ffffff; }

        /* Fraction Table */
        .master-table-container { width: 100%; max-width: 1300px; overflow-x: auto; background: rgba(20, 22, 28, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); scrollbar-width: thin; scrollbar-color: var(--table-color) rgba(255,255,255,0.05); }
        .master-table-container::-webkit-scrollbar { height: 10px; }
        .master-table-container::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 0 0 16px 16px; }
        .master-table-container::-webkit-scrollbar-thumb { background: var(--table-color); border-radius: 10px; }
        .master-table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: center; font-size: 1.05rem; }
        .master-table th, .master-table td { padding: 14px 18px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); border-right: 1px solid rgba(255, 255, 255, 0.05); white-space: nowrap; transition: background 0.2s, color 0.2s; }
        .master-table th { background: rgba(255, 255, 255, 0.05); color: var(--table-color); font-weight: 700; position: sticky; top: 0; z-index: 2; border-bottom: 2px solid var(--table-color); }
        .master-table td:first-child, .master-table th:first-child { position: sticky; left: 0; background: rgba(25, 28, 35, 0.95); color: var(--table-color); font-weight: 700; z-index: 3; border-right: 2px solid var(--table-color); }
        .master-table th:first-child { z-index: 4; }

        /* Shape Cards */
        .shape-card {
            background: rgba(20, 22, 28, 0.5); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-top: 1px solid rgba(255, 255, 255, 0.25); border-left: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px; padding: 20px; width: 280px; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 15px; transition: transform 0.2s;
        }
        .shape-title { text-align: center; margin: 0; font-size: 1.3rem; font-weight: 700; color: #fff; letter-spacing: 1px; text-transform: uppercase; border-bottom: 2px solid var(--table-color); padding-bottom: 10px; }
        
        .shape-img { height: 160px; display: flex; justify-content: center; align-items: center; color: var(--table-color); margin: 5px 0; }
        .shape-img svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 8px var(--table-color)); }
        
        /* 3D specific canvas container styles */
        .three-container { width: 100%; height: 180px; cursor: grab; display: flex; justify-content: center; align-items: center; outline: none; }
        .three-container:active { cursor: grabbing; }
        .three-container canvas { border-radius: 8px; }

        .formula-group { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; font-size: 0.95rem; align-items: center; }
        .formula-group span:first-child { color: rgba(255,255,255,0.6); font-weight: 500; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
        .formula-group span:last-child { font-weight: 700; color: #fff; text-align: right; }

        @media (hover: hover) {
            .data-row:hover { background: rgba(255, 255, 255, 0.1); transform: scale(1.05); border: 1px solid rgba(255, 255, 255, 0.2); }
            .data-row:hover .num, .data-row:hover .val { color: var(--highlight-color); text-shadow: 0 0 10px var(--highlight-color); }
            .shape-card:hover { transform: scale(1.02); border-color: rgba(255,255,255,0.3); box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(255,255,255,0.05); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .tab-btn { font-size: 0.85rem; padding: 10px 15px; }
            .glass-panel, .shape-card { width: 100%; max-width: 340px; }
        }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="content-wrapper">
        <h1 id="main-title">Mathematical Core Data</h1>
        
        <div class="tabs">
            <button id="btn-squares" class="tab-btn active-squares" onclick="switchTab('squares')">Squares</button>
            <button id="btn-cubes" class="tab-btn" onclick="switchTab('cubes')">Cubes</button>
            <button id="btn-fractions" class="tab-btn" onclick="switchTab('fractions')">Percentages</button>
            <button id="btn-2d" class="tab-btn" onclick="switchTab('2d')">2D Shapes</button>
            <button id="btn-3d" class="tab-btn" onclick="switchTab('3d')">3D Shapes</button>
        </div>

        <div class="grid-layout active-grid" id="grid-squares"></div>
        <div class="grid-layout" id="grid-cubes"></div>
        <div class="grid-layout" id="grid-fractions" style="--table-color: #ff8a00;"></div>
        <div class="grid-layout" id="grid-2d" style="--table-color: #39ff14;"></div>
        
        <!-- 3D Grid will hold the WebGL Canvases -->
        <div class="grid-layout" id="grid-3d" style="--table-color: #7000ff;"></div>
    </div>

    <script>
        const gridSquares = document.getElementById('grid-squares');
        const gridCubes = document.getElementById('grid-cubes');
        const gridFractions = document.getElementById('grid-fractions');
        const grid2d = document.getElementById('grid-2d');
        const grid3d = document.getElementById('grid-3d');
        
        // --- 1. SQUARES ---
        const squareThemes = [{ highlight: '#00f2fe' }, { highlight: '#ff0844' }, { highlight: '#b224ef' }, { highlight: '#ffc3a0' }, { highlight: '#43e97b' }];
        let htmlSquares = '';
        for (let col = 0; col < 5; col++) {
            htmlSquares += `<div class="glass-panel" style="--highlight-color: ${squareThemes[col].highlight}">
                        <div class="header-row"><span>No.</span><span>Square</span></div><div class="data-list">`;
            for (let row = 1; row <= 25; row++) {
                let num = col * 25 + row;
                htmlSquares += `<div class="data-row"><span class="num">${num}</span><span class="val">${(num * num).toLocaleString()}</span></div>`;
            }
            htmlSquares += `</div></div>`;
        }
        gridSquares.innerHTML = htmlSquares;

        // --- 2. CUBES ---
        const cubeThemes = [{ highlight: '#ff00ff' }, { highlight: '#ffcc00' }, { highlight: '#39ff14' }, { highlight: '#0099ff' }, { highlight: '#ff4500' }];
        let htmlCubes = '';
        for (let col = 0; col < 5; col++) {
            htmlCubes += `<div class="glass-panel" style="--highlight-color: ${cubeThemes[col].highlight}">
                        <div class="header-row"><span>No.</span><span>Cube</span></div><div class="data-list">`;
            for (let row = 1; row <= 6; row++) {
                let num = col * 6 + row;
                htmlCubes += `<div class="data-row"><span class="num">${num}</span><span class="val">${(num ** 3).toLocaleString()}</span></div>`;
            }
            htmlCubes += `</div></div>`;
        }
        gridCubes.innerHTML = htmlCubes;

        // --- 3. PERCENTAGES ---
        let htmlFractions = `<div class="master-table-container"><table class="master-table"><thead><tr><th>Denom \\ Num</th>`;
        for (let col = 1; col <= 10; col++) htmlFractions += `<th>${col}</th>`;
        htmlFractions += `</tr></thead><tbody>`;
        for (let row = 1; row <= 25; row++) {
            htmlFractions += `<tr><td>/ ${row}</td>`;
            for (let col = 1; col <= 10; col++) {
                let percentage = (col / row) * 100;
                let formatted = Number.isInteger(percentage) ? percentage : percentage.toFixed(2);
                htmlFractions += `<td>${formatted}%</td>`;
            }
            htmlFractions += `</tr>`;
        }
        htmlFractions += `</tbody></table></div>`;
        gridFractions.innerHTML = htmlFractions;

        // --- 4. 2D SHAPES (SVG Based) ---
        const data2D = [
            { name: "Rectangle", svg: `<svg viewBox="0 0 100 100"><rect x="10" y="30" width="80" height="40" fill="rgba(255,255,255,0.05)" stroke="currentColor" stroke-width="2"/><text x="50" y="20" fill="currentColor" text-anchor="middle" font-size="12">l</text><text x="96" y="55" fill="currentColor" font-size="12">b</text><line x1="10" y1="70" x2="90" y2="30" stroke="currentColor" stroke-dasharray="4" stroke-width="1"/><text x="45" y="45" fill="currentColor" font-size="12">d</text></svg>`, f1: ["Perimeter", "2(l + b)"], f2: ["Area", "l × b"], f3: ["Diagonal", "d = √(l² + b²)"] },
            { name: "Square", svg: `<svg viewBox="0 0 100 100"><rect x="25" y="25" width="50" height="50" fill="rgba(255,255,255,0.05)" stroke="currentColor" stroke-width="2"/><text x="50" y="18" fill="currentColor" text-anchor="middle" font-size="12">a</text><line x1="25" y1="75" x2="75" y2="25" stroke="currentColor" stroke-dasharray="4" stroke-width="1"/><text x="45" y="45" fill="currentColor" font-size="12">d</text></svg>`, f1: ["Perimeter", "4a"], f2: ["Area", "a² or d²/2"], f3: ["Diagonal", "d = a√2"] },
            { name: "Triangle", svg: `<svg viewBox="0 0 100 100"><polygon points="50,20 15,80 85,80" fill="rgba(255,255,255,0.05)" stroke="currentColor" stroke-width="2"/><line x1="50" y1="20" x2="50" y2="80" stroke="currentColor" stroke-dasharray="4" stroke-width="1"/><text x="25" y="50" fill="currentColor" font-size="12">a</text><text x="75" y="50" fill="currentColor" font-size="12">c</text><text x="50" y="95" fill="currentColor" text-anchor="middle" font-size="12">b</text><text x="55" y="55" fill="currentColor" font-size="12">h</text></svg>`, f1: ["Perimeter", "a + b + c"], f2: ["Area", "½ × b × h"], f3: ["Heron's Area", "√[s(s-a)(s-b)(s-c)]"] },
            { name: "Right Triangle", svg: `<svg viewBox="0 0 100 100"><polygon points="25,20 25,80 85,80" fill="rgba(255,255,255,0.05)" stroke="currentColor" stroke-width="2"/><rect x="25" y="70" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1"/><text x="12" y="55" fill="currentColor" font-size="12">h</text><text x="55" y="95" fill="currentColor" font-size="12">b</text><text x="60" y="45" fill="currentColor" font-size="12">c</text></svg>`, f1: ["Perimeter", "b + h + c"], f2: ["Area", "½ × b × h"], f3: ["Hypotenuse", "c = √(b² + h²)"] },
            { name: "Equilateral Triangle", svg: `<svg viewBox="0 0 100 100"><polygon points="50,20 15,80 85,80" fill="rgba(255,255,255,0.05)" stroke="currentColor" stroke-width="2"/><line x1="50" y1="20" x2="50" y2="80" stroke="currentColor" stroke-dasharray="4" stroke-width="1"/><text x="25" y="50" fill="currentColor" font-size="12">a</text><text x="75" y="50" fill="currentColor" font-size="12">a</text><text x="50" y="95" fill="currentColor" text-anchor="middle" font-size="12">a</text><text x="55" y="55" fill="currentColor" font-size="12">h</text></svg>`, f1: ["Perimeter", "3a"], f2: ["Area", "(√3 / 4)a²"], f3: ["Height", "h = (√3 a) / 2"] },
            { name: "Isosceles Right Triangle", svg: `<svg viewBox="0 0 100 100"><polygon points="25,20 25,80 85,80" fill="rgba(255,255,255,0.05)" stroke="currentColor" stroke-width="2"/><rect x="25" y="70" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1"/><text x="12" y="55" fill="currentColor" font-size="12">a</text><text x="55" y="95" fill="currentColor" font-size="12">a</text><text x="60" y="45" fill="currentColor" font-size="12">c</text></svg>`, f1: ["Perimeter", "2a + a√2"], f2: ["Area", "½ × a²"], f3: ["Hypotenuse", "c = a√2"] },
            { name: "Parallelogram", svg: `<svg viewBox="0 0 100 100"><polygon points="35,30 85,30 65,70 15,70" fill="rgba(255,255,255,0.05)" stroke="currentColor" stroke-width="2"/><line x1="35" y1="30" x2="35" y2="70" stroke="currentColor" stroke-dasharray="4" stroke-width="1"/><rect x="35" y="65" width="5" height="5" fill="none" stroke="currentColor" stroke-width="1"/><text x="60" y="20" fill="currentColor" font-size="12">a</text><text x="80" y="55" fill="currentColor" font-size="12">b</text><text x="25" y="55" fill="currentColor" font-size="12">h</text></svg>`, f1: ["Perimeter", "2(a + b)"], f2: ["Area", "a × h"], f3: ["", ""] },
            { name: "Rhombus", svg: `<svg viewBox="0 0 100 100"><polygon points="50,15 85,50 50,85 15,50" fill="rgba(255,255,255,0.05)" stroke="currentColor" stroke-width="2"/><line x1="15" y1="50" x2="85" y2="50" stroke="currentColor" stroke-dasharray="4" stroke-width="1"/><line x1="50" y1="15" x2="50" y2="85" stroke="currentColor" stroke-dasharray="4" stroke-width="1"/><rect x="50" y="50" width="5" height="5" fill="none" stroke="currentColor" stroke-width="1"/><text x="25" y="30" fill="currentColor" font-size="12">a</text><text x="75" y="30" fill="currentColor" font-size="12">a</text><text x="60" y="45" fill="currentColor" font-size="10">d1</text><text x="55" y="65" fill="currentColor" font-size="10">d2</text></svg>`, f1: ["Perimeter", "4a"], f2: ["Area", "½ × d1 × d2"], f3: ["Side", "a = √[(d1/2)² + (d2/2)²]"] },
            { name: "Trapezium", svg: `<svg viewBox="0 0 100 100"><polygon points="35,25 65,25 85,75 15,75" fill="rgba(255,255,255,0.05)" stroke="currentColor" stroke-width="2"/><line x1="35" y1="25" x2="35" y2="75" stroke="currentColor" stroke-dasharray="4" stroke-width="1"/><rect x="35" y="70" width="5" height="5" fill="none" stroke="currentColor" stroke-width="1"/><text x="50" y="15" fill="currentColor" font-size="12">b</text><text x="50" y="90" fill="currentColor" font-size="12">a</text><text x="25" y="55" fill="currentColor" font-size="12">h</text></svg>`, f1: ["Perimeter", "Sum of 4 sides"], f2: ["Area", "½ × h × (a + b)"], f3: ["", ""] },
            { name: "Circle", svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="rgba(255,255,255,0.05)" stroke="currentColor" stroke-width="2"/><circle cx="50" cy="50" r="2" fill="currentColor"/><line x1="50" y1="50" x2="85" y2="50" stroke="currentColor" stroke-width="1"/><text x="65" y="45" fill="currentColor" font-size="12">r</text></svg>`, f1: ["Perimeter", "2πr"], f2: ["Area", "πr²"], f3: ["", ""] },
            { name: "Semicircle", svg: `<svg viewBox="0 0 100 100"><path d="M15,65 A35,35 0 0,1 85,65 Z" fill="rgba(255,255,255,0.05)" stroke="currentColor" stroke-width="2"/><circle cx="50" cy="65" r="2" fill="currentColor"/><line x1="50" y1="65" x2="85" y2="65" stroke="currentColor" stroke-dasharray="4" stroke-width="1"/><text x="65" y="60" fill="currentColor" font-size="12">r</text></svg>`, f1: ["Perimeter", "πr + 2r"], f2: ["Area", "½ × πr²"], f3: ["", ""] },
            { name: "Disc (Ring)", svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="rgba(255,255,255,0.05)" stroke="currentColor" stroke-width="2"/><circle cx="50" cy="50" r="20" fill="#030305" stroke="currentColor" stroke-width="2"/><circle cx="50" cy="50" r="2" fill="currentColor"/><line x1="50" y1="50" x2="90" y2="50" stroke="currentColor" stroke-width="1"/><line x1="50" y1="50" x2="64" y2="64" stroke="currentColor" stroke-width="1"/><text x="70" y="45" fill="currentColor" font-size="12">a</text><text x="45" y="65" fill="currentColor" font-size="12">b</text></svg>`, f1: ["Perimeter", "-"], f2: ["Area", "π(a² - b²)" ], f3: ["", ""] },
            { name: "Sector", svg: `<svg viewBox="0 0 100 100"><path d="M50,80 L15,20 A55,55 0 0,1 85,20 Z" fill="rgba(255,255,255,0.05)" stroke="currentColor" stroke-width="2"/><text x="25" y="55" fill="currentColor" font-size="12">r</text><text x="75" y="55" fill="currentColor" font-size="12">r</text><text x="50" y="12" fill="currentColor" font-size="12">a</text><text x="50" y="60" fill="currentColor" font-size="10">θ</text></svg>`, f1: ["Perimeter", "a + 2r"], f2: ["Area", "(θ/360°) × πr²"], f3: ["Arc (a)", "a = (θ/360°) × 2πr"] }
        ];

        let html2D = '';
        data2D.forEach(item => {
            html2D += `<div class="shape-card">
                <h3 class="shape-title">${item.name}</h3>
                <div class="shape-img">${item.svg}</div>
                ${item.f1[0] ? `<div class="formula-group"><span>${item.f1[0]}</span><span>${item.f1[1]}</span></div>` : ''}
                ${item.f2[0] ? `<div class="formula-group"><span>${item.f2[0]}</span><span>${item.f2[1]}</span></div>` : ''}
                ${item.f3[0] ? `<div class="formula-group"><span>${item.f3[0]}</span><span>${item.f3[1]}</span></div>` : ''}
            </div>`;
        });
        grid2d.innerHTML = html2D;

        // --- 5. 3D SHAPES (Data Structure for WebGL Canvases) ---
        const data3D = [
            { id: "Cuboid", name: "Cuboid", f1: ["Lateral SA", "2h(l + b)"], f2: ["Total SA", "2(lb + bh + hl)"], f3: ["Volume", "l × b × h"] },
            { id: "Cube", name: "Cube", f1: ["Lateral SA", "4a²"], f2: ["Total SA", "6a²"], f3: ["Volume", "a³"] },
            { id: "Cylinder", name: "Cylinder", f1: ["Curved SA", "2πrh"], f2: ["Total SA", "2πr(r + h)"], f3: ["Volume", "πr²h"] },
            { id: "Cone", name: "Cone", f1: ["Curved SA", "πrl"], f2: ["Total SA", "πr(l + r)"], f3: ["Volume", "⅓πr²h"] },
            { id: "Sphere", name: "Sphere", f1: ["Surface Area", "4πr²"], f2: ["Total SA", "4πr²"], f3: ["Volume", "(4/3)πr³"] },
            { id: "Hemisphere", name: "Hemisphere", f1: ["Curved SA", "2πr²"], f2: ["Total SA", "3πr²"], f3: ["Volume", "⅔πr³"] },
            { id: "HollowCylinder", name: "Hollow Cylinder", f1: ["Curved SA", "2π(R + r)h"], f2: ["Total SA", "2π(R+r)h + 2π(R²-r²)"], f3: ["Volume", "π(R² - r²)h"] },
            { id: "Frustum", name: "Frustum of Cone", f1: ["Curved SA", "πl(R + r)"], f2: ["Total SA", "πl(R+r) + πR² + πr²"], f3: ["Volume", "⅓πh(R² + r² + Rr)"] }
        ];

        let html3D = '';
        data3D.forEach(item => {
            html3D += `<div class="shape-card">
                <h3 class="shape-title">${item.name}</h3>
                <div id="model-${item.id}" class="three-container"></div>
                ${item.f1[0] ? `<div class="formula-group"><span>${item.f1[0]}</span><span>${item.f1[1]}</span></div>` : ''}
                ${item.f2[0] ? `<div class="formula-group"><span>${item.f2[0]}</span><span>${item.f2[1]}</span></div>` : ''}
                ${item.f3[0] ? `<div class="formula-group"><span>${item.f3[0]}</span><span>${item.f3[1]}</span></div>` : ''}
            </div>`;
        });
        grid3d.innerHTML = html3D;

        // --- TRUE 3D ENGINE (THREE.JS) LOGIC ---
        let threeInitialized = false;
        let activeRenderers = [];

        function createGeometry(id) {
            switch(id) {
                // Cuboid explicitly made longer than the cube to show a distinct difference
                case 'Cuboid': return new THREE.BoxGeometry(3.5, 1.5, 2); 
                case 'Cube': return new THREE.BoxGeometry(2.2, 2.2, 2.2);
                case 'Cylinder': return new THREE.CylinderGeometry(1.2, 1.2, 2.8, 32);
                case 'Cone': return new THREE.ConeGeometry(1.5, 3, 32);
                case 'Sphere': return new THREE.SphereGeometry(1.6, 32, 32);
                case 'Hemisphere': 
                    const hemiGroup = new THREE.Group();
                    const sg = new THREE.SphereGeometry(1.6, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
                    const cg = new THREE.CircleGeometry(1.6, 32);
                    return { isGroup: true, geom1: sg, geom2: cg }; // Custom handling for complex shape
                case 'HollowCylinder':
                    const shape = new THREE.Shape();
                    shape.absarc(0, 0, 1.6, 0, Math.PI * 2, false);
                    const hole = new THREE.Path();
                    hole.absarc(0, 0, 1.1, 0, Math.PI * 2, true);
                    shape.holes.push(hole);
                    const ext = new THREE.ExtrudeGeometry(shape, { depth: 2.8, bevelEnabled: false, curveSegments: 32 });
                    ext.center();
                    ext.rotateX(Math.PI / 2);
                    return ext;
                case 'Frustum': return new THREE.CylinderGeometry(0.8, 1.6, 2.8, 32);
            }
        }

        function buildMesh(id, material, edgeMaterial) {
            const data = createGeometry(id);
            if (data.isGroup) {
                const group = new THREE.Group();
                
                const mesh1 = new THREE.Mesh(data.geom1, material);
                mesh1.add(new THREE.LineSegments(new THREE.EdgesGeometry(data.geom1), edgeMaterial));
                
                const mesh2 = new THREE.Mesh(data.geom2, material);
                mesh2.rotation.x = Math.PI / 2;
                mesh2.add(new THREE.LineSegments(new THREE.EdgesGeometry(data.geom2), edgeMaterial));
                
                group.add(mesh1);
                group.add(mesh2);
                return group;
            } else {
                const mesh = new THREE.Mesh(data, material);
                const wireframe = new THREE.LineSegments(new THREE.EdgesGeometry(data), edgeMaterial);
                mesh.add(wireframe);
                return mesh;
            }
        }

        function init3DModels() {
            if (threeInitialized) return;
            threeInitialized = true;

            // Glossy holographic glass material
            const material = new THREE.MeshPhysicalMaterial({
                color: 0x7000ff, metalness: 0.2, roughness: 0.1,
                transparent: true, opacity: 0.6, transmission: 0.5, side: THREE.DoubleSide
            });
            const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x00f2fe, transparent: true, opacity: 0.8 });

            data3D.forEach(item => {
                const container = document.getElementById(`model-${item.id}`);
                if (!container) return;

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
                camera.position.set(3, 4, 6);

                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(container.clientWidth, container.clientHeight);
                renderer.setPixelRatio(window.devicePixelRatio);
                container.appendChild(renderer.domElement);

                // Lighting to show depth
                scene.add(new THREE.AmbientLight(0xffffff, 0.6));
                const directional = new THREE.DirectionalLight(0xffffff, 0.8);
                directional.position.set(5, 10, 7);
                scene.add(directional);

                // Add constructed shape to scene
                const mesh = buildMesh(item.id, material, edgeMaterial);
                scene.add(mesh);

                // Add interactive orbit controls
                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableZoom = false; // Disabled so mobile scrolling still works outside canvas
                controls.enablePan = false;
                controls.autoRotate = true; // Slowly spins to prove it is 3D
                controls.autoRotateSpeed = 2.0;

                activeRenderers.push({ renderer, camera, container });

                function animate() {
                    requestAnimationFrame(animate);
                    controls.update();
                    renderer.render(scene, camera);
                }
                animate();
            });
        }

        // --- TAB LOGIC ---
        const title = document.getElementById('main-title');
        let currentMode = 'squares';

        const tabConfig = {
            'squares': { gradient: 'linear-gradient(to right, #00f2fe, #4facfe, #00f2fe)', class: 'active-squares', line: '#00f2fe' },
            'cubes': { gradient: 'linear-gradient(to right, #ff00ff, #00ffff, #ccff00)', class: 'active-cubes', line: '#ff00ff' },
            'fractions': { gradient: 'linear-gradient(to right, #ff8a00, #e52e71)', class: 'active-fractions', line: '#ff8a00' },
            '2d': { gradient: 'linear-gradient(to right, #39ff14, #00c3ff)', class: 'active-2d', line: '#39ff14' },
            '3d': { gradient: 'linear-gradient(to right, #7000ff, #ff0055)', class: 'active-3d', line: '#7000ff' }
        };

        window.switchTab = function(tabName) {
            currentMode = tabName;
            ['squares', 'cubes', 'fractions', '2d', '3d'].forEach(id => {
                document.getElementById(`btn-${id}`).className = 'tab-btn';
                document.getElementById(`grid-${id}`).classList.remove('active-grid');
            });
            document.getElementById(`btn-${tabName}`).className = `tab-btn ${tabConfig[tabName].class}`;
            document.getElementById(`grid-${tabName}`).classList.add('active-grid');
            title.style.background = tabConfig[tabName].gradient;
            title.style.webkitBackgroundClip = 'text';

            if (tabName === '3d') init3DModels(); // Initialize 3D only when tab is clicked to save memory
        };

        // --- BACKGROUND PARTICLES & RESIZE EVENT ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        let pointer = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', (e) => { pointer.x = e.clientX; pointer.y = e.clientY; });
        window.addEventListener('mouseout', () => { pointer.x = null; pointer.y = null; });
        window.addEventListener('touchstart', (e) => { pointer.x = e.touches[0].clientX; pointer.y = e.touches[0].clientY; });
        window.addEventListener('touchmove', (e) => { pointer.x = e.touches[0].clientX; pointer.y = e.touches[0].clientY; });
        window.addEventListener('touchend', () => { pointer.x = null; pointer.y = null; });

        function resize() { 
            width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; initParticles(); 
            
            // Re-calculate 3D canvases on window resize
            activeRenderers.forEach(r => {
                r.camera.aspect = r.container.clientWidth / r.container.clientHeight;
                r.camera.updateProjectionMatrix();
                r.renderer.setSize(r.container.clientWidth, r.container.clientHeight);
            });
        }
        window.addEventListener('resize', resize);
        
        class Particle {
            constructor() {
                this.x = Math.random() * width; this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 1 - 0.5; this.speedY = Math.random() * 1 - 0.5;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > width || this.x < 0) this.speedX *= -1;
                if (this.y > height || this.y < 0) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        function initParticles() {
            particles = []; let numberOfParticles = (width * height) / 9000;
            for (let i = 0; i < numberOfParticles; i++) particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update(); particles[i].draw();
                for (let j = i; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x; const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 100) {
                        ctx.beginPath(); ctx.strokeStyle = `rgba(255, 255, 255, ${0.15 - distance/1000})`; ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke();
                    }
                }
                if (pointer.x != null) {
                    const dxMouse = particles[i].x - pointer.x; const dyMouse = particles[i].y - pointer.y;
                    const distanceMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);
                    if (distanceMouse < pointer.radius) {
                        ctx.beginPath();
                        let hex = tabConfig[currentMode].line;
                        let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
                        ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${1 - distanceMouse/pointer.radius})`;
                        ctx.lineWidth = 1.5; ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(pointer.x, pointer.y); ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        resize(); animateParticles();
    </script>
</body>
